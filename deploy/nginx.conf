# nginx in front of the Node process.
#
# ---------------------------------------------------------------------------
# ALREADY SERVING THIS SITE WITH WORKING HTTPS? Do NOT copy this file over the
# existing config — you'd drop the certbot lines and break TLS. Instead, open
# the server block you already have and replace the body of `location / { ... }`
# with the proxy_pass block further down. That is the whole cutover, and it
# keeps your certificates untouched.
#
#   sudo cp /etc/nginx/sites-available/<yours> /root/nginx-backup.conf
#   sudo nano /etc/nginx/sites-available/<yours>     # swap the location / body
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rollback is `sudo cp /root/nginx-backup.conf ...` and reload.
#
# Use the full file below only for a host that has no config for this site yet.
# ---------------------------------------------------------------------------
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate:
#   sudo certbot --nginx -d example.com -d www.example.com
# (certbot rewrites the :80 block below into a redirect and fills in the
#  ssl_certificate lines for you.)
#
# Replace example.com throughout.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Everything goes to Node: it serves the static site AND the API, so the
    # admin routes can't be reached without passing through the session check.
    # Do not add a `root` + `try_files` block for the site directory here —
    # that would let nginx serve files the app means to protect.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The analytics beacon is small and frequent; no need to buffer it.
    location = /api/events {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        access_log         off;
    }

    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
