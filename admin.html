<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Site Admin — Jacob Fletcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">

  <!-- ===== Passcode gate ===== -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <p class="eyebrow">Site Admin</p>
      <h1 id="gate-title">Enter passcode</h1>
      <div class="field">
        <label for="gate-input">Passcode</label>
        <input type="password" id="gate-input" autocomplete="current-password" />
      </div>
      <div class="field" id="gate-confirm-field" hidden>
        <label for="gate-confirm">Confirm passcode</label>
        <input type="password" id="gate-confirm" autocomplete="new-password" />
      </div>
      <p class="gate-err" id="gate-err"></p>
      <button class="btn btn-primary" id="gate-go" type="button">Unlock</button>
      <p class="note" id="gate-note">
        The passcode is a latch on this browser, not security — the files are public on a
        static host. Keep <code>admin.html</code> out of your deploy if that matters.
      </p>
    </div>
  </div>

  <!-- ===== Console ===== -->
  <div class="admin-shell" id="shell">

    <header class="topbar">
      <div class="topbar-brand">
        <strong>Site Admin</strong>
        <span>jacob fletcher</span>
      </div>
      <div class="topbar-actions">
        <span class="status-chip" id="status">loading…</span>
        <button class="btn btn-ghost btn-sm" id="btn-preview" type="button">Preview</button>
        <button class="btn btn-ghost btn-sm" id="btn-revert" type="button">Revert</button>
        <button class="btn btn-ghost btn-sm" id="btn-copy" type="button">Copy JSON</button>
        <button class="btn btn-primary btn-sm" id="btn-publish" type="button">Download content.json</button>
      </div>
    </header>

    <div class="admin-body">
      <nav class="rail" id="rail" aria-label="Admin sections"></nav>
      <main class="panel" id="panel"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- data-auto="off": opening the admin must not log pageviews into your own stats -->
  <script src="analytics.js" data-auto="off"></script>
  <script src="admin.js"></script>
</body>
</html>
